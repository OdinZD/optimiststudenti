<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2D3E7B">
    <title>Nema veze · Optimist</title>
    <style>
        :root { --ink: #14171F; --ink2: #3A4256; --bg: #F4F5F7; --surface: #FFFFFF; --acc: #2D3E7B; --line: #E4E7EE; }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            background: var(--bg);
            color: var(--ink);
            font-family: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
            display: flex; align-items: center; justify-content: center; padding: 24px;
        }
        .card {
            width: 100%; max-width: 400px; text-align: center;
            background: var(--surface); border: 1px solid var(--line);
            border-radius: 16px; padding: 32px 24px;
        }
        .mark {
            width: 48px; height: 48px; margin: 0 auto 16px; border-radius: 12px;
            background: var(--acc); display: inline-flex; align-items: center; justify-content: center;
        }
        .mark span { width: 20px; height: 20px; border: 3px solid #fff; border-radius: 999px; display: block; }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { font-size: 14px; color: var(--ink2); margin: 0 0 20px; }
        button {
            height: 44px; padding: 0 20px; border: 0; border-radius: 10px;
            background: var(--acc); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="mark"><span></span></div>
        <h1>Nema internetske veze</h1>
        <p>Provjeri vezu i pokušaj ponovno.</p>
        <button type="button" onclick="location.reload()">Pokušaj ponovno</button>
    </div>
</body>
</html>
